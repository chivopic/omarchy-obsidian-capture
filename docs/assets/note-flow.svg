<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Thought capture to Obsidian note flow</title>
  <desc id="desc">Capture a thought in the panel or with a shortcut, create a dated Markdown note, and let Obsidian sync the vault.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#9ba9bb" stroke-width="2"/></marker></defs>
  <rect width="1200" height="360" rx="26" fill="#171c25"/>
  <text x="600" y="55" text-anchor="middle" fill="#f1f4f8" font-family="sans-serif" font-size="24" font-weight="700">从一个念头，到一篇可整理的笔记</text>
  <g font-family="sans-serif">
    <rect x="52" y="116" width="260" height="166" rx="18" fill="#242d39" stroke="#455261"/>
    <circle cx="88" cy="153" r="18" fill="#9b83ed"/><text x="88" y="159" text-anchor="middle" fill="#171421" font-size="16" font-weight="700">1</text>
    <text x="117" y="160" fill="#f0f3f8" font-size="19" font-weight="700">快速捕捉</text>
    <text x="78" y="205" fill="#bdc7d4" font-size="15">顶部栏面板输入想法</text><text x="78" y="232" fill="#bdc7d4" font-size="15">或用快捷键打开 Rofi</text>
    <path d="M329 198h58" stroke="#9ba9bb" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="405" y="116" width="342" height="166" rx="18" fill="#242d39" stroke="#455261"/>
    <circle cx="441" cy="153" r="18" fill="#9b83ed"/><text x="441" y="159" text-anchor="middle" fill="#171421" font-size="16" font-weight="700">2</text>
    <text x="470" y="160" fill="#f0f3f8" font-size="19" font-weight="700">生成 Markdown 笔记</text>
    <text x="431" y="205" fill="#bdc7d4" font-size="15">时间戳 + 首行标题，避免覆盖</text><text x="431" y="232" fill="#bdc7d4" font-size="15">附带 created、inbox、idea 元数据</text>
    <path d="M764 198h58" stroke="#9ba9bb" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="840" y="116" width="308" height="166" rx="18" fill="#24352f" stroke="#5d927d"/>
    <circle cx="876" cy="153" r="18" fill="#79d5b1"/><text x="876" y="159" text-anchor="middle" fill="#10251d" font-size="16" font-weight="700">3</text>
    <text x="905" y="160" fill="#f0f3f8" font-size="19" font-weight="700">保存到 Obsidian 库</text>
    <text x="866" y="205" fill="#c6d8d0" font-size="15">Inbox/YYYY-MM-DD HHmm 标题.md</text><text x="866" y="232" fill="#c6d8d0" font-size="15">Obsidian 自动发现并同步</text>
    <text x="600" y="326" text-anchor="middle" fill="#8f9cac" font-size="14">本地写入 · Markdown 纯文本 · 不依赖云端 API</text>
  </g>
</svg>
